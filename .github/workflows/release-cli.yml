name: Release CLI

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "packages/**"
  workflow_dispatch:

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.value }}
      should-release: ${{ steps.should-release.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "value=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: should-release
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.value }}" | grep -q .; then
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.value }} already exists — skipping release"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "Will release v${{ steps.version.outputs.value }}"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    environment: production
    needs: check
    if: needs.check.outputs.should-release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: guillo-darwin-arm64
          - target: bun-darwin-x64
            artifact: guillo-darwin-x64
          - target: bun-linux-arm64
            artifact: guillo-linux-arm64
          - target: bun-linux-x64
            artifact: guillo-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun build --compile --target=${{ matrix.target }} ./src/index.ts --outfile dist/${{ matrix.artifact }}
        working-directory: apps/cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/cli/dist/${{ matrix.artifact }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    environment: production
    needs: [check, build]
    if: needs.check.outputs.should-release == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: dist/*

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    needs: [check, release]
    if: needs.check.outputs.should-release == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Sync version and publish
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          cd apps/cli/npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
