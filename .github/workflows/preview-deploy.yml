name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build CLI binaries for all platforms
      - name: Build CLI binaries
        run: |
          cd apps/cli
          mkdir -p dist
          bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile dist/guillo-linux-x64
          bun build --compile --target=bun-linux-arm64 ./src/index.ts --outfile dist/guillo-linux-arm64
          bun build --compile --target=bun-darwin-x64 ./src/index.ts --outfile dist/guillo-darwin-x64
          bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile dist/guillo-darwin-arm64

      # Upload CLI binaries as artifacts
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guillo-preview-pr${{ github.event.pull_request.number }}
          path: apps/cli/dist/guillo-*
          retention-days: 7

      # Deploy the preview API Worker with all vars inline.
      # GitHub Actions masks secret values in logs so --var is safe here.
      - name: Deploy preview API
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          WORKER_NAME="guilloteam-api-preview-${PR_NUM}"
          npx wrangler deploy --env preview \
            --name "${WORKER_NAME}" \
            --var "BETTER_AUTH_URL:https://${WORKER_NAME}.kwybro.workers.dev" \
            --var "LIBSQL_URL:${{ secrets.PREVIEW_LIBSQL_URL }}" \
            --var "LIBSQL_AUTH_TOKEN:${{ secrets.PREVIEW_LIBSQL_AUTH_TOKEN }}" \
            --var "BETTER_AUTH_SECRET:${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}" \
            --var "RESEND_API_KEY:${{ secrets.PREVIEW_RESEND_API_KEY }}"

      # Post a comment on the PR with preview info and install commands
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const apiUrl = `https://guilloteam-api-preview-${prNum}.kwybro.workers.dev`;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const runId = context.runId;
            const artifactName = `guillo-preview-pr${prNum}`;

            const body = [
              `## ⚔️ CLI Preview Ready`,
              ``,
              `**API:** \`${apiUrl}\``,
              ``,
              `### Install preview CLI`,
              ``,
              `Download the binary for your platform from the [workflow artifacts](https://github.com/${repo}/actions/runs/${runId}):`,
              ``,
              '```bash',
              `# macOS (Apple Silicon)`,
              `curl -L "https://nightly.link/${repo}/actions/runs/${runId}/${artifactName}.zip" -o guillo.zip`,
              `unzip guillo.zip && chmod +x guillo-darwin-arm64 && sudo mv guillo-darwin-arm64 /usr/local/bin/guillo`,
              '```',
              ``,
              '<details>',
              '<summary>Other platforms</summary>',
              ``,
              '```bash',
              `# macOS (Intel)`,
              `curl -L "https://nightly.link/${repo}/actions/runs/${runId}/${artifactName}.zip" -o guillo.zip`,
              `unzip guillo.zip && chmod +x guillo-darwin-x64 && sudo mv guillo-darwin-x64 /usr/local/bin/guillo`,
              '```',
              ``,
              '```bash',
              `# Linux (x64)`,
              `curl -L "https://nightly.link/${repo}/actions/runs/${runId}/${artifactName}.zip" -o guillo.zip`,
              `unzip guillo.zip && chmod +x guillo-linux-x64 && sudo mv guillo-linux-x64 /usr/local/bin/guillo`,
              '```',
              ``,
              '```bash',
              `# Linux (ARM64)`,
              `curl -L "https://nightly.link/${repo}/actions/runs/${runId}/${artifactName}.zip" -o guillo.zip`,
              `unzip guillo.zip && chmod +x guillo-linux-arm64 && sudo mv guillo-linux-arm64 /usr/local/bin/guillo`,
              '```',
              '</details>',
              ``,
              `**From your phone?** Open this PR branch in a [GitHub Codespace](https://github.com/${repo}/codespaces/new?ref=${context.payload.pull_request.head.ref}) — the CLI is ready to build and run.`,
              ``,
              `<sub>Artifacts expire after 7 days. Updated on each push to this PR.</sub>`,
            ].join('\n');

            // Find existing preview comment to update instead of creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CLI Preview Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }
