name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the CLI for Linux (used inside the container)
      - name: Build CLI
        run: |
          cd apps/cli
          bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile dist/guillo-linux-x64

      # Deploy the preview API Worker with all vars inline.
      # GitHub Actions masks secret values in logs so --var is safe here.
      - name: Deploy preview API
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          WORKER_NAME="guilloteam-api-preview-${PR_NUM}"
          npx wrangler deploy --env preview \
            --name "${WORKER_NAME}" \
            --var "BETTER_AUTH_URL:https://${WORKER_NAME}.kwybro.workers.dev" \
            --var "LIBSQL_URL:${{ secrets.PREVIEW_LIBSQL_URL }}" \
            --var "LIBSQL_AUTH_TOKEN:${{ secrets.PREVIEW_LIBSQL_AUTH_TOKEN }}" \
            --var "BETTER_AUTH_SECRET:${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}" \
            --var "RESEND_API_KEY:${{ secrets.PREVIEW_RESEND_API_KEY }}"

      # Copy CLI binary into the cli-preview directory for Docker build context
      - name: Stage CLI binary for container
        run: cp apps/cli/dist/guillo-linux-x64 apps/cli-preview/guillo

      # Deploy CLI preview to Fly.io — one app per PR with auto-stop
      - name: Deploy CLI preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          APP_NAME="guilloteam-cli-preview-${PR_NUM}"
          API_URL="https://guilloteam-api-preview-${PR_NUM}.kwybro.workers.dev"

          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"

          # Create the app if it doesn't exist yet
          fly apps create "${APP_NAME}" --org personal 2>/dev/null || true

          # Deploy with the API URL set as an env var
          cd apps/cli-preview
          fly deploy \
            --app "${APP_NAME}" \
            --env "GUILLOTEAM_API_URL=${API_URL}" \
            --wait-timeout 120 \
            --strategy immediate

      # Post a comment on the PR with preview URLs
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const apiUrl = `https://guilloteam-api-preview-${prNum}.kwybro.workers.dev`;
            const terminalUrl = `https://guilloteam-cli-preview-${prNum}.fly.dev`;

            const body = [
              `## ⚔️ CLI Preview Ready`,
              ``,
              `| | URL |`,
              `|---|---|`,
              `| **Terminal** | [Open browser terminal](${terminalUrl}) |`,
              `| **API** | \`${apiUrl}\` |`,
              ``,
              `Open the terminal link on any device (including mobile) to try the CLI changes from this PR.`,
              ``,
              `<sub>The terminal container auto-stops when idle and wakes on the next request (~5s cold start).</sub>`,
            ].join('\n');

            // Find existing preview comment to update instead of creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CLI Preview Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }
