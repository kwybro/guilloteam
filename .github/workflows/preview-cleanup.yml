name: Preview Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}

          # Delete CLI preview Worker + Container
          npx wrangler delete --name "guilloteam-cli-preview-${PR_NUM}" --force || true

          # Delete preview API Worker
          npx wrangler delete --name "guilloteam-api-preview-${PR_NUM}" --force || true

          echo "Cleaned up preview deployments for PR #${PR_NUM}"
