services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guilloteam
      POSTGRES_USER: guilloteam
      POSTGRES_PASSWORD: guilloteam
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guilloteam"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - guilloteam-postgres:/var/lib/postgresql/data

  guilloteam:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3400:3400"
    environment:
      DATABASE_URL: postgres://guilloteam:guilloteam@postgres:5432/guilloteam
      GUILLOTEAM_INGEST_TOKEN: local-ingest-token
      GUILLOTEAM_AGENT_TOKEN: local-agent-token

volumes:
  guilloteam-postgres:
